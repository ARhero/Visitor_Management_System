name: vms

x-api-env: &api-env
  ENV: dev
  DATABASE_URL: postgresql+asyncpg://vms_app:vms_app@postgres:5432/vms
  DATABASE_ADMIN_URL: postgresql+asyncpg://vms:vms@postgres:5432/vms
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-dev-insecure-change-me-0123456789abcdef}
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
  CORS_ORIGINS: '["http://localhost:5173"]'
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_BUCKET: vms-media
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_REGION: ap-south-1

services:
  postgres:
    image: postgres:16-alpine # >= 15 required (ON DELETE SET NULL (column) on composite FKs)
    environment:
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms
      POSTGRES_DB: vms
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vms"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION: ap-south-1
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
             mc mb -p local/vms-media && mc anonymous set none local/vms-media"

  api:
    build: ./api
    environment: *api-env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 3"
    volumes: ["./api/app:/srv/app", "./api/alembic:/srv/alembic", "./api/scripts:/srv/scripts", "./api/tests:/srv/tests"]
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Background jobs (escalations, auto check-out, retention). Real jobs arrive in Phase 2;
  # the service is wired now so the topology doesn't change later.
  worker:
    build: ./api
    environment: *api-env
    command: arq app.workers.settings.WorkerSettings
    volumes: ["./api/app:/srv/app"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes: ["./web:/web", "webmodules:/web/node_modules"]
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
  webmodules:
